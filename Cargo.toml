[package]
name = "report-client"
version = "0.1.0"
edition = "2021"
description = "Order Assistant report printer client (GPUI Kit)"

[dependencies]
gpui-kit = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "process", "sync", "macros"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
regex = "1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"
png = "0.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
